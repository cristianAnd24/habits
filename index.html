<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Daily</title>
<style>
/* ==========================================================================
   Design tokens — Apple system colours, light
   ========================================================================== */
:root{
  --bg:#f2f2f7; --card:#ffffff; --sheet:#ffffff;
  --glass:rgba(249,249,249,.72); --bar:rgba(249,249,249,.82);
  --f1:rgba(120,120,128,.2); --f2:rgba(120,120,128,.16);
  --f3:rgba(118,118,128,.12); --f4:rgba(116,116,128,.08);
  --lab:#000000; --lab2:rgba(60,60,67,.6); --lab3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);
  --tint:#5856d6; --tint-weak:rgba(88,86,214,.12); --on-tint:#ffffff;
  --gold:#ff9500; --gold-weak:rgba(255,149,0,.12);
  --red:#ff3b30; --green:#34c759; --brown:#ac7f5e; --purple:#af52de; --pink:#ff2d55;
  --h1:rgba(255,149,0,.26); --h2:rgba(255,149,0,.5); --h3:rgba(255,149,0,.74); --h4:#ff9500;
  --pop:0 10px 34px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.1);
  --lift:0 -14px 50px rgba(0,0,0,.18);
  --thumb:#ffffff; --thumb-sh:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI Variable Text","Segoe UI",sans-serif;
  --arabic:"Geeza Pro","SF Arabic","Noto Naskh Arabic","Times New Roman",serif;
  --ease:cubic-bezier(.32,.72,0,1);          /* iOS sheet curve */
  --spring:cubic-bezier(.2,.9,.25,1.12);     /* iOS pop         */
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --sheet:#1c1c1e;
  --glass:rgba(44,44,46,.74); --bar:rgba(22,22,24,.82);
  --f1:rgba(120,120,128,.36); --f2:rgba(120,120,128,.32);
  --f3:rgba(118,118,128,.24); --f4:rgba(116,116,128,.18);
  --lab:#ffffff; --lab2:rgba(235,235,245,.6); --lab3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);
  --tint:#5e5ce6; --tint-weak:rgba(94,92,230,.22); --on-tint:#ffffff;
  --gold:#ff9f0a; --gold-weak:rgba(255,159,10,.18);
  --red:#ff453a; --green:#30d158; --brown:#b78a66; --purple:#bf5af2; --pink:#ff375f;
  --h1:rgba(255,159,10,.28); --h2:rgba(255,159,10,.52); --h3:rgba(255,159,10,.76); --h4:#ff9f0a;
  --thumb:#636366; --thumb-sh:0 3px 8px rgba(0,0,0,.3);
  --pop:0 10px 34px rgba(0,0,0,.5); --lift:0 -14px 50px rgba(0,0,0,.6);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --sheet:#1c1c1e;
  --glass:rgba(44,44,46,.74); --bar:rgba(22,22,24,.82);
  --f1:rgba(120,120,128,.36); --f2:rgba(120,120,128,.32);
  --f3:rgba(118,118,128,.24); --f4:rgba(116,116,128,.18);
  --lab:#ffffff; --lab2:rgba(235,235,245,.6); --lab3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);
  --tint:#5e5ce6; --tint-weak:rgba(94,92,230,.22); --on-tint:#ffffff;
  --gold:#ff9f0a; --gold-weak:rgba(255,159,10,.18);
  --red:#ff453a; --green:#30d158; --brown:#b78a66; --purple:#bf5af2; --pink:#ff375f;
  --h1:rgba(255,159,10,.28); --h2:rgba(255,159,10,.52); --h3:rgba(255,159,10,.76); --h4:#ff9f0a;
  --thumb:#636366; --thumb-sh:0 3px 8px rgba(0,0,0,.3);
  --pop:0 10px 34px rgba(0,0,0,.5); --lift:0 -14px 50px rgba(0,0,0,.6);
  color-scheme:dark;}

/* ==========================================================================
   Base
   ========================================================================== */
*,*::before,*::after{box-sizing:inherit}
/* A thin, faint bar on a transparent track. The gutter is always reserved, so a
   tab that scrolls and one that does not sit in the same place — the layout used
   to jump sideways on every tab switch, and again whenever a sheet locked the
   page. scrollbar-gutter does nothing where scrollbars overlay the content, so
   iOS keeps its own transient indicator untouched. */
html{height:100%;-webkit-text-size-adjust:100%;
  scrollbar-width:thin;scrollbar-color:var(--f1) transparent}
/* Only where a scrollbar actually occupies layout. Touch platforms overlay
   theirs, and reserving a gutter there would leave a dead strip down the side. */
@media (pointer:fine){html{scrollbar-gutter:stable}}
body{margin:0;min-height:100%;background:var(--bg);color:var(--lab);
  font:400 17px/1.29 var(--sans);letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none}
body.locked{overflow:hidden}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
/* Without this, two quick taps on one control (the page stepper especially)
   register as iOS double-tap-to-zoom. "manipulation" drops only the
   double-tap gesture; panning and pinch-to-zoom still work, which
   user-scalable=no would have taken away. */
button,input,select,textarea,a,label,[role="button"]{touch-action:manipulation}
button{cursor:pointer;-webkit-appearance:none;appearance:none;border:0;background:none;padding:0}
input{-webkit-appearance:none;appearance:none}
:focus{outline:none}
/* No border-radius here: an outline already follows the element's own corners,
   and setting one reshapes whatever is focused — it was squaring off the round
   date arrows. */
:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px}
/* Rows in these float flush with the container's edge, so an outward ring spills
   past the rounded corner. Draw it inward instead. */
.alert :focus-visible,.menu :focus-visible{outline-offset:-3px}
.alert:focus,.alert:focus-visible{outline:none}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=search]::-webkit-search-cancel-button,
input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block;flex:none}

/* ==========================================================================
   Navigation bar + large title
   ========================================================================== */
/* Two stages, as on iOS. The material arrives the moment the large title starts
   tucking under, so it slides behind frosted glass; leaving the blur switched on
   while the bar is transparent sliced the title in half instead. blur(0) rather
   than none so the filter has something to interpolate from. */
.navbar{position:fixed;top:0;left:0;right:0;z-index:40;padding-top:env(safe-area-inset-top,0px);
  -webkit-backdrop-filter:blur(0px) saturate(100%);backdrop-filter:blur(0px) saturate(100%);
  background:transparent;
  transition:background .24s linear,-webkit-backdrop-filter .24s linear,backdrop-filter .24s linear}
.navbar.material{background:var(--bar);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.navbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.5px;
  background:var(--sep);opacity:0;transition:opacity .24s linear}
.navbar.material::after{opacity:1}
.navbar .in{position:relative;height:44px;max-width:560px;margin:0 auto;padding:0 10px;
  display:flex;align-items:center;justify-content:center}
.navbar .nt{font-size:17px;font-weight:600;letter-spacing:-.022em;
  opacity:0;transform:translateY(7px);transition:opacity .2s ease,transform .2s ease}
.navbar.titled .nt{opacity:1;transform:none}
.navbar .more{position:absolute;right:6px;top:0;bottom:0;width:44px;
  display:flex;align-items:center;justify-content:center;color:var(--tint);
  transition:opacity .15s}
.navbar .more:active{opacity:.4}
.navbar .more.due::after{content:"";position:absolute;top:9px;right:8px;width:8px;height:8px;
  border-radius:50%;background:var(--gold);box-shadow:0 0 0 2.5px var(--bg)}

main{max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 52px) 16px calc(env(safe-area-inset-bottom,0px) + 112px)}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 4px 16px}
.big h1{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:.004em;margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",var(--sans)}
.sync{font-size:13px;color:var(--lab2);padding-bottom:5px;display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--lab3)}

/* ==========================================================================
   Grouped list
   ========================================================================== */
.shdr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  margin:26px 20px 7px;font-size:13px;line-height:1.3}
.shdr .t{font-weight:400;color:var(--lab2);text-transform:uppercase;letter-spacing:.045em}
.shdr .x{color:var(--lab2);font-variant-numeric:tabular-nums}
.shdr button.x{display:flex;align-items:center;gap:3px;color:var(--tint);font-weight:500;
  text-transform:none;letter-spacing:-.01em;padding:2px 0}
.shdr button.x:active{opacity:.4}
.foot{font-size:13px;line-height:1.35;color:var(--lab2);margin:7px 20px 0}
.note{font-size:13px;line-height:1.42;color:var(--lab);background:var(--gold-weak);
  border-radius:10px;padding:12px 14px;margin:12px 0 0}
.note b{font-weight:600}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 16px;
  position:relative;width:100%;text-align:left}
.cell+.cell::before,.cell+.card-sub::before{content:"";position:absolute;top:0;left:16px;right:0;
  border-top:.5px solid var(--sep)}
.cell.block{display:block}
.cl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv{color:var(--lab2);font-variant-numeric:tabular-nums;text-align:right}
.sub{font-size:15px;color:var(--lab2)}
button.cell{-webkit-tap-highlight-color:transparent}
button.cell:active,.tap:active{background:var(--f4)}
.chev{color:var(--lab3);margin-right:-2px}
.empty{color:var(--lab2);padding:15px 16px;margin:0;font-size:15px}

/* ==========================================================================
   Date navigator
   ========================================================================== */
.datenav{display:flex;align-items:center;gap:4px;padding:5px 6px}
.arrow{width:46px;height:46px;border-radius:50%;color:var(--tint);
  display:flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s}
.arrow:active:not(:disabled){background:var(--f4)}
.arrow:disabled{color:var(--lab3)}
.dlabel{flex:1;min-width:0;text-align:center;border-radius:10px;padding:5px 4px;
  display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .15s}
.dlabel:active{background:var(--f4)}
.dlabel b{font-size:17px;font-weight:600;letter-spacing:-.022em;display:flex;align-items:center;gap:5px}
.dlabel b svg{color:var(--tint)}
.dlabel span{font-size:13px;color:var(--lab2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ==========================================================================
   Prayers
   ========================================================================== */
.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:14px 8px 12px}
.prayer{display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:11px;font-weight:500;color:var(--lab2);transition:color .2s}
.prayer i{width:48px;height:48px;border-radius:50%;background:var(--f3);
  display:flex;align-items:center;justify-content:center;color:var(--lab2);
  transition:background .24s var(--spring),transform .24s var(--spring),color .18s}
.prayer:active i{transform:scale(.9)}
.prayer[aria-pressed="true"]{color:var(--lab)}
.prayer[aria-pressed="true"] i{background:var(--gold);color:#fff}
.prayer.pop i{animation:pop .36s var(--spring)}
@keyframes pop{0%{transform:scale(1)}36%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.prayer.pop i{animation:none}}

/* ==========================================================================
   Segmented control
   ========================================================================== */
.seg{position:relative;display:flex;background:var(--f3);border-radius:9px;padding:2px;
  width:204px;flex:none;isolation:isolate}
/* width:100% when it stands alone (the Stats range), but flex-basis 0 lets it
   give way to a row icon instead of overflowing the card. */
.seg.wide{width:100%;flex:1 1 0;min-width:0}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:0;border-radius:7px;
  background:var(--thumb);box-shadow:var(--thumb-sh);z-index:0;opacity:0;
  transition:transform .26s var(--spring),width .26s var(--spring),opacity .16s,background .2s}
.seg.on .thumb{opacity:1}
.seg button{position:relative;z-index:1;flex:1;min-width:0;border-radius:7px;padding:6px 8px;
  font-size:13px;font-weight:500;letter-spacing:-.006em;color:var(--lab);
  transition:color .2s,transform .12s}
.seg button:active{transform:scale(.95)}
.seg button::after{content:"";position:absolute;left:-1.5px;top:5px;bottom:5px;width:1px;
  background:var(--sep);opacity:0;transition:opacity .2s}
.seg button:not(:first-of-type)::after{opacity:1}
.seg button[aria-pressed="true"]::after,
.seg button[aria-pressed="true"]+button::after{opacity:0}
.seg button[aria-pressed="true"]{font-weight:600}
/* habit counter readout: dash = unrecorded, 0 = a clean day, 1+ = slips */
.ico{width:29px;height:29px;border-radius:7px;flex:none;display:inline-flex;
  align-items:center;justify-content:center;vertical-align:-7px}
.shdr .ico{margin-right:7px}
.pm button.txt{font-size:15px;font-weight:600;letter-spacing:-.01em}
/* A third button would otherwise squeeze the row label into an ellipsis. */
.stepper.multi .pm button{width:39px}
.stepper.multi .cnt{width:44px}
/* Small phones: give the row label its space back rather than ellipsis it. */
@media (max-width:389px){
  .stepper .cnt{width:46px}
  .pm button{width:40px}
  .stepper.multi .cnt{width:36px}
  .stepper.multi .pm button{width:34px}
  .cell{gap:10px}
}
.cnt{width:58px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:8px;background:var(--f3);font-size:17px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--lab3);transition:color .18s}
.cnt.zero{color:var(--green)}
.cnt.some{color:var(--red);font-weight:600}
/* iOS switch, for the habits that are simply yes or no */
.tgl{width:51px;height:31px;flex:none;border-radius:16px;background:var(--f1);
  position:relative;transition:background .26s var(--ease)}
.tgl[aria-checked="true"]{background:var(--red)}
.tgl span{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);
  transition:transform .26s var(--ease)}
.tgl[aria-checked="true"] span{transform:translateX(20px)}

/* ==========================================================================
   Stepper
   ========================================================================== */
.stepper{display:flex;align-items:center;gap:10px;flex:none}
.stepper input{width:58px;height:34px;text-align:center;border-radius:8px;border:0;
  background:var(--f3);font-size:17px;font-variant-numeric:tabular-nums;
  transition:background .15s,box-shadow .15s}
.stepper input:focus{background:var(--card);box-shadow:0 0 0 2px var(--tint)}
.pm{display:flex;background:var(--f3);border-radius:8px;overflow:hidden}
.pm button{width:46px;height:34px;display:flex;align-items:center;justify-content:center;
  color:var(--lab);transition:background .12s}
.pm button:active{background:var(--f1)}
.pm button:disabled{color:var(--lab3)}
.pm button+button{box-shadow:inset .5px 0 0 var(--sep)}
.unit{color:var(--lab2);font-size:15px;width:18px}

/* ==========================================================================
   Progress + tiles
   ========================================================================== */
.qtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.qtop b{font-size:22px;font-weight:600;letter-spacing:-.022em;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--f3);overflow:hidden;margin:11px 0 8px}
.bar span{display:block;height:100%;border-radius:4px;background:var(--gold);
  transition:width .5s var(--ease)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:12px;padding:12px 14px;min-width:0}
.tile span{display:block;font-size:13px;color:var(--lab2);margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font-size:13px;color:var(--lab2);margin-top:2px}

/* ==========================================================================
   Search field
   ========================================================================== */
.search{position:relative;display:flex;align-items:center;gap:7px;height:36px;
  background:var(--f3);border-radius:10px;padding:0 9px;margin:0 0 2px;color:var(--lab2)}
.search input{flex:1;min-width:0;border:0;background:none;font-size:17px;height:100%}
.search input::placeholder{color:var(--lab2)}
.search .clr{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--lab2);flex:none}

/* ==========================================================================
   Surah rows
   ========================================================================== */
.surah{display:flex;align-items:center;gap:11px;min-height:46px;padding:9px 16px;
  width:100%;text-align:left;position:relative}
.surah+.surah::before{content:"";position:absolute;top:0;left:16px;right:0;
  border-top:.5px solid var(--sep)}
.surah:active{background:var(--f4)}
.surah .n{width:26px;flex:none;color:var(--lab3);font-size:15px;font-variant-numeric:tabular-nums}
.surah .en{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.surah .ar{font-family:var(--arabic);font-size:19px;line-height:1.5;color:var(--lab2);
  flex:none;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck{width:23px;height:23px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;color:transparent;box-shadow:inset 0 0 0 1.5px var(--f1);
  transition:background .22s var(--spring),box-shadow .22s,color .18s,transform .22s var(--spring)}
.surah:active .ck{transform:scale(.88)}
.surah[aria-pressed="true"] .ck{background:var(--gold);box-shadow:none;color:#fff}

/* ==========================================================================
   Buttons
   ========================================================================== */
.btn{width:100%;border-radius:12px;background:var(--tint);color:var(--on-tint);
  font-size:17px;font-weight:600;letter-spacing:-.022em;padding:15px;margin-top:14px;
  transition:transform .12s,opacity .12s}
.btn:active:not(:disabled){transform:scale(.98);opacity:.85}
.btn:disabled{background:var(--f3);color:var(--lab3);cursor:default}
.btn.ghost{background:var(--f3);color:var(--tint);margin-top:9px}
.btn.danger{background:var(--f3);color:var(--red);margin-top:9px}
.mini{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--tint);border-radius:50%;transition:background .15s}
.mini:active{background:var(--f4)}
.cin{flex:1;min-width:0;border:0;background:none;text-align:right;font-size:17px;
  color:var(--lab);font-variant-numeric:tabular-nums}
/* Marks the standing record for an exercise. */
.pr{display:inline-block;margin-left:7px;padding:1.5px 6px;border-radius:5px;
  background:var(--gold);color:#fff;font-size:11px;font-weight:700;
  letter-spacing:.03em;line-height:1.35;vertical-align:2px}
.cin::placeholder{color:var(--lab3)}

/* ==========================================================================
   Swipe-to-delete rows
   ========================================================================== */
.sw{position:relative;overflow:hidden;touch-action:pan-y}
.sw+.sw::before{content:"";position:absolute;top:0;left:16px;right:0;z-index:2;
  border-top:.5px solid var(--sep)}
.sw-act{position:absolute;top:0;right:0;bottom:0;width:96px;background:var(--red);color:#fff;
  font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center}
.sw-act:active{filter:brightness(.88)}
.sw-in{position:relative;z-index:1;background:var(--card);
  transition:transform .32s var(--ease);will-change:transform}
.sw-in .cell::before{display:none}

/* ==========================================================================
   Heat calendar
   ========================================================================== */
.heat-card{margin-top:10px}
.heat-box{padding:13px 16px 15px}
.heat-cap{font-size:13px;color:var(--lab2);margin-bottom:10px}
.heat-dow,.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat-dow{margin-bottom:7px}
.heat-dow i{font-size:11px;font-weight:600;color:var(--lab3);text-align:center;font-style:normal}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--f4);position:relative;font-style:normal}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}
.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
/* habit grids read semantically: green = none that day, red = slips */
.heat i.ok{background:var(--green)}
.heat i.bad{background:var(--red);opacity:.5}
.heat i.bad2{background:var(--red);opacity:.92}
.heat i.fut{background:none;box-shadow:inset 0 0 0 1px var(--f4)}
.heat i.today{box-shadow:0 0 0 2px var(--lab)}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;
  margin-top:11px;font-size:11px;color:var(--lab3)}
.legend i{width:11px;height:11px;border-radius:3px;background:var(--f4);font-style:normal}
.legend i.l1{background:var(--h1)}.legend i.l2{background:var(--h2)}
.legend i.l3{background:var(--h3)}.legend i.l4{background:var(--h4)}
.legend i.ok{background:var(--green)}
.legend i.bad{background:var(--red);opacity:.5}
.legend i.bad2{background:var(--red);opacity:.92}

/* ==========================================================================
   Tab bar
   ========================================================================== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 .5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{padding:7px 0 5px;color:var(--lab2);font-size:10px;font-weight:500;
  letter-spacing:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:color .18s}
.tabbar button[aria-current="page"]{color:var(--tint)}
.tabbar svg{width:27px;height:27px}
.tabbar .off{display:block}.tabbar .on{display:none}
.tabbar button[aria-current="page"] .off{display:none}
.tabbar button[aria-current="page"] .on{display:block}

/* ==========================================================================
   Overlays — shared
   ========================================================================== */
.ov{position:fixed;inset:0;z-index:60;display:flex}
.ov-back{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;
  transition:opacity .34s var(--ease)}
.ov-back.clear{background:transparent;transition:none}
.ov.in .ov-back{opacity:1}

/* --- Alert (UIAlertController) --- */
.alert-ov{align-items:center;justify-content:center;padding:20px}
.alert{position:relative;width:270px;max-width:100%;border-radius:14px;overflow:hidden;
  background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);
  backdrop-filter:blur(28px) saturate(180%);box-shadow:var(--pop);text-align:center;
  opacity:0;transform:scale(1.12);transition:opacity .2s,transform .2s var(--spring)}
.alert-ov.in .alert{opacity:1;transform:scale(1)}
.alert-head{padding:19px 16px 15px}
.alert-head b{display:block;font-size:17px;font-weight:600;letter-spacing:-.022em}
.alert-head p{margin:4px 0 0;font-size:13px;line-height:1.35;color:var(--lab)}
.alert-acts{display:flex;box-shadow:inset 0 .5px 0 var(--sep)}
.alert-acts.stack{flex-direction:column}
.alert-btn{flex:1;min-width:0;min-height:44px;padding:11px 10px;font-size:17px;color:var(--tint);
  letter-spacing:-.022em;transition:background .12s}
.alert-btn+.alert-btn{box-shadow:inset .5px 0 0 var(--sep)}
.alert-acts.stack .alert-btn+.alert-btn{box-shadow:inset 0 .5px 0 var(--sep)}
.alert-btn:active{background:var(--f3)}
.alert-btn.cancel{font-weight:600}
.alert-btn.dest{color:var(--red)}

/* --- Menu (UIMenu) --- */
.menu-ov{pointer-events:none}
.menu-ov .ov-back{pointer-events:auto}
.menu{position:absolute;min-width:232px;max-width:min(300px,calc(100vw - 24px));
  border-radius:13px;overflow:hidden auto;max-height:min(420px,calc(100vh - 40px));scrollbar-width:thin;
  background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);
  backdrop-filter:blur(28px) saturate(180%);box-shadow:var(--pop);pointer-events:auto;
  opacity:0;transform:scale(.86);-webkit-overflow-scrolling:touch;
  transition:opacity .16s,transform .22s var(--spring)}
.menu.in{opacity:1;transform:scale(1)}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;
  padding:11px 15px;font-size:17px;letter-spacing:-.022em;text-align:left;
  transition:background .12s}
.menu-item+.menu-item{box-shadow:inset 0 .5px 0 var(--sep)}
.menu-item:active{background:var(--f2)}
.menu-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-item svg{color:var(--lab)}
.menu-item.dest,.menu-item.dest svg{color:var(--red)}
.menu-item .ck-i{color:var(--lab);opacity:0}
.menu-item.sel .ck-i{opacity:1}
.menu-title{padding:9px 15px 8px;font-size:13px;line-height:1.3;color:var(--lab2);
  text-align:center;box-shadow:inset 0 .5px 0 var(--sep)}
.menu-title:first-child{box-shadow:none}
.menu-sep{height:8px;background:var(--sep);opacity:.5}

/* --- Sheet --- */
.sheet-ov{align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:560px;background:var(--sheet);
  border-radius:14px 14px 0 0;box-shadow:var(--lift);
  padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateY(100%);transition:transform .44s var(--ease);will-change:transform}
.sheet-ov.in .sheet{transform:translateY(0)}
.grab-zone{padding-top:7px;touch-action:none;cursor:grab}
.grab{width:36px;height:5px;border-radius:3px;background:var(--f1);margin:0 auto}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 8px 9px;touch-action:none}
.sheet-bar b{font-size:17px;font-weight:600;letter-spacing:-.022em;text-align:center;flex:1}
.sheet-bar button{min-width:74px;min-height:34px;padding:6px 10px;font-size:17px;color:var(--tint);
  letter-spacing:-.022em;border-radius:8px;transition:background .12s,opacity .12s}
.sheet-bar button:active{opacity:.4}
.sheet-bar button.l{text-align:left}.sheet-bar button.r{text-align:right;font-weight:600}
.sheet-body{padding:0 12px 14px}

/* --- Calendar (UIDatePicker .inline) --- */
.cal{-webkit-user-select:none;user-select:none}
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:4px 6px 10px}
.cal-title{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;
  font-size:17px;font-weight:600;letter-spacing:-.022em;transition:background .15s}
.cal-title:active{background:var(--f4)}
.cal-title svg{color:var(--tint);transition:transform .3s var(--spring)}
.cal.picking .cal-title{color:var(--tint)}
.cal.picking .cal-title svg{transform:rotate(180deg)}
.cal-nav{display:flex;gap:2px}
.cal-nav button{width:42px;height:42px;border-radius:50%;color:var(--tint);
  display:flex;align-items:center;justify-content:center;transition:background .15s}
.cal-nav button:active:not(:disabled){background:var(--f4)}
.cal-nav button:disabled{color:var(--lab3)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.cal-dow i{font-size:13px;font-weight:600;color:var(--lab2);text-align:center;font-style:normal}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0}
.cal-grid.slide-l{animation:sl .26s var(--ease)}
.cal-grid.slide-r{animation:sr .26s var(--ease)}
@keyframes sl{from{opacity:.2;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:.2;transform:translateX(-16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cal-grid.slide-l,.cal-grid.slide-r{animation:none}}
.cal-grid>*{position:relative;width:100%;aspect-ratio:1;max-height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:400;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0 auto;
  transition:background .2s var(--spring),color .18s,transform .2s var(--spring)}
.cal-grid .pad{visibility:hidden}
.cal-grid .dim{color:var(--lab3)}
.cal-grid .now{color:var(--tint);font-weight:600}
.cal-grid .sel{background:var(--tint);color:#fff;font-weight:600}
.cal-grid button:not(:disabled):active{transform:scale(.86)}
.cal-grid em{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--gold)}
.cal-grid .sel em{background:#fff}
.cal-wheels{display:none;grid-template-columns:1.4fr 1fr;position:relative}
.cal.picking .cal-wheels{display:grid}
.cal.picking .cal-dow,.cal.picking .cal-grid{display:none}

/* --- Wheel (UIPickerView) --- */
.wheels{position:relative}
.wheels::before{content:"";position:absolute;left:0;right:0;top:50%;height:36px;
  transform:translateY(-50%);border-radius:9px;background:var(--f4);pointer-events:none}
.wheel{height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:72px 0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;position:relative;
  -webkit-mask-image:linear-gradient(transparent,#000 26%,#000 74%,transparent);
  mask-image:linear-gradient(transparent,#000 26%,#000 74%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel i{display:flex;align-items:center;justify-content:center;height:36px;
  scroll-snap-align:center;font-size:21px;font-style:normal;color:var(--lab2);
  letter-spacing:-.02em;transition:color .18s,opacity .18s;opacity:.6}
.wheel i.on{color:var(--lab);opacity:1;font-weight:500}

/* --- HUD --- */
.hud{position:fixed;left:50%;top:50%;z-index:80;transform:translate(-50%,-50%) scale(.9);
  min-width:148px;padding:20px 22px;border-radius:16px;text-align:center;
  background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);
  backdrop-filter:blur(28px) saturate(180%);box-shadow:var(--pop);
  opacity:0;transition:opacity .2s,transform .24s var(--spring);pointer-events:none}
.hud.in{opacity:1;transform:translate(-50%,-50%) scale(1)}
.hud svg{margin:0 auto 9px;color:var(--lab)}
.hud span{font-size:15px;font-weight:500}
</style>

/* ==========================================================================
   Data
   ========================================================================== */
const PRAYERS=["Fajr","Dhuhr","Asr","Maghrib","Isha"];

function blankDay(){

/* Reads a habit's count straight off the stored row — no day() object built,
   because the streak scan calls this once per day of history. An absent or
   blank value is 0: a day with nothing logged is a day it did not happen. */
function countOf(key,k,row){
  const r=row!==undefined?row:S.days[k];
  if(!r)return 0;
  const v=r[key];
  return v===true?0:v===false?1
    :(typeof v==="number"&&isFinite(v)&&v>=0)?Math.min(maxOf(key),Math.round(v)):0;
}
function day(k){
  const d=Object.assign(blankDay(),S.days[k]||{});
  d.c=Object.assign({},d.c);
  d.prayers=Array.isArray(d.prayers)?d.prayers.slice(0,5):blankDay().prayers;
  while(d.prayers.length<5)d.prayers.push(false);
  /* These were booleans before counts: true meant a clean day, so 0; false meant
     it happened at least once, and 1 is the honest floor. Coercing on every read
     keeps old days, restored backups and synced rows all correct. */
  for(const h of TRACKED)d[h.key]=countOf(h.key,k,S.days[k]);
  return d;
}

      if(row[h.key]===true){row[h.key]=0;changed=true}
      else if(row[h.key]===false){row[h.key]=1;changed=true}
    }

})();

/* ==========================================================================

   --------------------------------------------------------------------------
   Supabase over plain fetch rather than its SDK, so the app stays a single file
   with no third-party script to cache or to trust. Sign-in uses an emailed code
   rather than a magic link, because a link opens Safari — not the installed
   app — which would break the flow on the one device this is for.

   The publishable key below is meant to be public; row-level security is what
   keeps the data private, so each account can only ever read its own row.
   ========================================================================== */
let SB_URL="";   /* https://<project>.supabase.co */
let SB_KEY="";   /* publishable (anon) key */

const SESSION_KEY="daily-habits-session";
const syncConfigured=()=>!!(SB_URL&&SB_KEY);

let session=null;

const signedIn=()=>!!(session&&session.access_token&&session.user);
function saveSession(s){
  session=s;
  try{s?localStorage.setItem(SESSION_KEY,JSON.stringify(s)):localStorage.removeItem(SESSION_KEY)}catch(e){}
}

function setSync(state){

  n.classList.remove("hidden");

/* ---- transport ---- */
async function sbFetch(path,opts,isRetry){
  const o=opts||{};
  const headers=Object.assign({apikey:SB_KEY,"Content-Type":"application/json"},
    signedIn()?{Authorization:"Bearer "+session.access_token}:{},o.headers||{});
  const r=await fetch(SB_URL+path,Object.assign({},o,{headers}));
  /* One silent refresh, then give up rather than loop. */
  if(r.status===401&&signedIn()&&!isRetry&&await refreshSession())return sbFetch(path,opts,true);
  return r;
}
async function refreshSession(){
  if(!session||!session.refresh_token)return false;
  try{
    const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{
      method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!r.ok){saveSession(null);return false}
    saveSession(await r.json());
    return true;
  }catch(e){return false}
}
const sbError=async r=>{
  try{const j=await r.json();return j.msg||j.error_description||j.message||"Something went wrong"}
  catch(e){return "Something went wrong"}
};

/* ---- sign in with an emailed code ---- */
async function sendCode(email){
  const r=await fetch(`${SB_URL}/auth/v1/otp`,{method:"POST",
    headers:{apikey:SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email,create_user:true})});
  if(!r.ok)throw new Error(await sbError(r));
}
async function verifyCode(email,token){
  const r=await fetch(`${SB_URL}/auth/v1/verify`,{method:"POST",
    headers:{apikey:SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({type:"email",email,token})});
  if(!r.ok)throw new Error(await sbError(r));
  saveSession(await r.json());
}
function signOut(){saveSession(null);setSync(null);renderAll()}

/* ---- merge ----
   Nothing is ever dropped: days are unioned, and where both sides hold the same
   date the fuller record wins, local breaking ties. Lists are unioned by id, so
   a lift saved on one device cannot be erased by the other. The cost is that a
   deletion made on one device can come back from the other. For a log whose job
   is to survive, resurrecting an entry beats losing one. */
function dayWeight(d){
  const x=Object.assign(blankDay(),d||{});
  const p=Array.isArray(x.prayers)?x.prayers.filter(Boolean).length:0;
  return p+(+x.quran>0?1:0)+(x.gym?1:0)+TRACKED.filter(h=>countOf(h.key,"",x)>0).length;
}
function mergeState(a,b){
  a=a||{};b=b||{};
  const ad=a.days||{},bd=b.days||{};
  const out={days:{},meta:Object.assign(META0(),b.meta||{},a.meta||{})};
  for(const k of new Set([...Object.keys(ad),...Object.keys(bd)])){
    const x=ad[k],y=bd[k];
    out.days[k]= !x?y : !y?x : (dayWeight(x)>=dayWeight(y)?x:y);
  }
  const prs=new Map();
  for(const p of ((b.meta||{}).prs||[]))if(p&&p.id)prs.set(p.id,p);
  for(const p of ((a.meta||{}).prs||[]))if(p&&p.id)prs.set(p.id,p);
  out.meta.prs=[...prs.values()];
  out.meta.surahs=[...new Set([...(((b.meta||{}).surahs)||[]),...(((a.meta||{}).surahs)||[])])]
    .filter(n=>typeof n==="number").sort((x,y)=>x-y);
  out.meta.rounds=Math.max(((a.meta||{}).rounds)||0,((b.meta||{}).rounds)||0);
  return out;
}

/* ---- pull / push ---- */
async function pullRemote(){
  const r=await sbFetch(`/rest/v1/${TABLE}?select=data&limit=1`,{method:"GET"});
  if(!r.ok)throw new Error(await sbError(r));
  const rows=await r.json();
  return rows.length?rows[0].data:null;
}
let pushTimer=null,pushing=false,pushAgain=false;
async function pushRemote(){
  if(!syncConfigured()||!signedIn())return;
  if(pushing){pushAgain=true;return}
  pushing=true;setSync("saving");
  try{
    const r=await sbFetch(`/rest/v1/${TABLE}?on_conflict=user_id`,{method:"POST",
      headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({user_id:session.user.id,data:S,updated_at:new Date().toISOString()})});
    setSync(r.ok?"on":"off");
  }catch(e){setSync("off")}
  finally{pushing=false;if(pushAgain){pushAgain=false;pushRemote()}}
}
/* Called by every edit. Saves locally first, always — the network is a bonus. */
function schedule(){
  saveLocal();
  if(!syncConfigured()||!signedIn())return;
  clearTimeout(pushTimer);pushTimer=setTimeout(pushRemote,1200);
}
async function connect(){
  if(!syncConfigured()||!signedIn()){setSync(null);return}
  setSync("saving");
  try{
    const remote=await pullRemote();
    if(remote){S=mergeState(S,remote);saveLocal();applyTheme();renderAll()}
    await pushRemote();
  }catch(e){setSync("off")}
}

const UI=$("ui");
let locks=0;
function lock(on){locks=Math.max(0,locks+(on?1:-1));document.body.classList.toggle("locked",locks>0)}
function overlay(cls){
  const root=el("div","ov "+cls);
  UI.appendChild(root);lock(true);
  let closed=false;
  /* Reflow, then flip the class: a real transition that does not need rAF,
     which never fires while the page is in a background tab. */
  root.show=()=>{void root.offsetWidth;root.classList.add("in")};
  root.close=()=>{
    if(closed)return;closed=true;
    root.classList.remove("in");lock(false);
    setTimeout(()=>root.remove(),460);
  };
  return root;
}

/* --- iOS alert, promise based --- */
function alertBox({title,message,actions}){
  return new Promise(res=>{
    const root=overlay("alert-ov");
    const back=el("div","ov-back");
    const box=el("div","alert");
    box.setAttribute("role","alertdialog");
    box.setAttribute("aria-modal","true");
    box.tabIndex=-1;
    box.appendChild(el("div","alert-head",
      (title?`<b>${esc(title)}</b>`:"")+(message?`<p>${esc(message)}</p>`:"")));
    const acts=el("div","alert-acts"+(actions.length>2?" stack":""));
    actions.forEach((a,i)=>{
      const b=el("button","alert-btn"+(a.style==="destructive"?" dest":"")+(a.style==="cancel"?" cancel":""),esc(a.label));
      b.onclick=()=>{root.close();res("value"in a?a.value:i)};
      acts.appendChild(b);
    });
    box.appendChild(acts);
    back.onclick=()=>{root.close();res(null)};
    root.append(back,box);root.show();
    /* Focus the dialog, not a button. Focusing an action made iOS paint a focus
       ring on it for someone who only ever tapped; this still moves focus into
       the dialog for keyboard and screen-reader users, who then Tab to a button. */
    box.focus({preventScroll:true});
  });
}
const confirmBox=(title,message,label="Delete",destructive=true)=>alertBox({
  title,message,actions:[
    {label:"Cancel",style:"cancel",value:false},
    {label,style:destructive?"destructive":"default",value:true}
  ]}).then(v=>v===true);

/* --- iOS menu, anchored to a trigger --- */
function menu(anchor,items){
  const root=overlay("menu-ov");
  const back=el("div","ov-back clear");
  const m=el("div","menu");
  items.forEach(it=>{
    if(it.separator){m.appendChild(el("div","menu-sep"));return}
    if(it.title){m.appendChild(el("div","menu-title",esc(it.title)));return}
    const b=el("button","menu-item"+(it.destructive?" dest":"")+(it.selected?" sel":""));
    b.innerHTML=`<span>${esc(it.label)}</span>`+(it.selected!==undefined?CHECK:(it.icon||""));
    b.onclick=()=>{root.close();haptic();it.onSelect&&it.onSelect()};
    m.appendChild(b);
  });
  m.style.visibility="hidden";
  root.append(back,m);
  /* Measuring right after append is safe: layout is up to date synchronously. */
  const r=anchor.getBoundingClientRect(),P=8;
  const w=m.offsetWidth,h=m.offsetHeight,vw=innerWidth,vh=innerHeight;
  const left=clampNum(r.right-w,P,Math.max(P,vw-w-P));
  let top=r.bottom+6,from="0";
  if(top+h>vh-P){
    if(r.top-h-6>=P){top=r.top-h-6;from=h+"px"}
    else{top=clampNum((vh-h)/2,P,vh-h-P);from=h/2+"px"}
  }
  m.style.left=left+"px";m.style.top=top+"px";
  m.style.transformOrigin=`${clampNum(r.left+r.width/2-left,14,Math.max(14,w-14))}px ${from}`;
  m.style.visibility="";
  void m.offsetWidth;
  m.classList.add("in");
  root.show();
  back.onclick=()=>root.close();
  return root;
}

/* --- Bottom sheet with drag to dismiss --- */
function sheet({title,left="Cancel",right,onRight,build}){
  const root=overlay("sheet-ov");
  const back=el("div","ov-back");
  const s=el("div","sheet");
  const zone=el("div","grab-zone",'<div class="grab"></div>');
  const bar=el("div","sheet-bar");
  const lb=el("button","l",esc(left));lb.onclick=()=>root.close();
  const tt=el("b",null,esc(title||""));
  const rb=el("button","r",esc(right||""));
  /* onRight returning false keeps the sheet open, so validation can refuse. */
  if(right)rb.onclick=()=>{if(onRight&&onRight()===false)return;root.close()};
  else rb.style.visibility="hidden";
  bar.append(lb,tt,rb);
  const body=el("div","sheet-body");
  s.append(zone,bar,body);
  root.append(back,s);
  back.onclick=()=>root.close();
  build(body,root);
  root.show();

  /* drag the handle / bar down to dismiss */
  let y0=0,dy=0,dragging=false;
  const down=e=>{
    if(e.target.closest("button"))return;
    dragging=true;y0=e.clientY;dy=0;
    s.style.transition="none";
    try{zone.setPointerCapture(e.pointerId)}catch(err){}
  };
  const move=e=>{
    if(!dragging)return;
    dy=Math.max(0,e.clientY-y0);
    s.style.transform=`translateY(${dy}px)`;
    back.style.opacity=String(Math.max(0,1-dy/420));
  };
  const up=()=>{
    if(!dragging)return;dragging=false;
    s.style.transition="";back.style.opacity="";
    if(dy>96)root.close();else s.style.transform="";
  };
  [zone,bar].forEach(n=>n.addEventListener("pointerdown",down));
  zone.addEventListener("pointermove",move);
  zone.addEventListener("pointerup",up);
  zone.addEventListener("pointercancel",up);
  return root;
}

/* --- Wheel picker column --- */
const ROW=36;
function wheel(values,index,onChange){
  const w=el("div","wheel");
  w.innerHTML=values.map(v=>`<i>${esc(v)}</i>`).join("");
  const items=[...w.children];
  const mark=i=>items.forEach((n,j)=>n.classList.toggle("on",j===i));
  let idx=clampNum(index,0,values.length-1);mark(idx);
  w.init=()=>{w.scrollTop=idx*ROW};   /* call once the column is in the document */
  let raf=null,settle=null;
  w.addEventListener("scroll",()=>{
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=null;
      const i=clampNum(Math.round(w.scrollTop/ROW),0,values.length-1);
      if(i!==idx){idx=i;mark(idx);haptic(4)}
    });
    clearTimeout(settle);
    settle=setTimeout(()=>onChange&&onChange(idx),130);
  },{passive:true});
  w.setTo=i=>{idx=clampNum(i,0,values.length-1);mark(idx);w.scrollTo({top:idx*ROW,behavior:"smooth"})};
  w.get=()=>idx;
  return w;
}

/* --- Apple-style inline calendar --- */
function calendar({value,min,max,onPick}){
  const node=el("div","cal");
  const selKey=value;
  let view=fromKey(value);view.setDate(1);
  const minD=fromKey(min),maxD=fromKey(max);
  minD.setDate(1);

  const bar=el("div","cal-bar");
  const title=el("button","cal-title",
    `<span></span><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16.6 5.1 9.7a1.2 1.2 0 0 1 1.7-1.7L12 13.2l5.2-5.2a1.2 1.2 0 0 1 1.7 1.7z"/></svg>`);
  const nav=el("div","cal-nav");
  const prev=el("button",null,'<svg width="11" height="18" viewBox="0 0 13 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 1.5 2.5 11 11 20.5"/></svg>');
  const next=el("button",null,'<svg width="11" height="18" viewBox="0 0 13 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1.5 10.5 11 2 20.5"/></svg>');
  prev.setAttribute("aria-label","Previous month");next.setAttribute("aria-label","Next month");
  title.setAttribute("aria-label","Choose month and year");
  nav.append(prev,next);bar.append(title,nav);

  const dow=el("div","cal-dow",DOW.map(d=>`<i>${esc(d)}</i>`).join(""));
  const grid=el("div","cal-grid");
  const wheels=el("div","cal-wheels wheels");
  node.append(bar,dow,grid,wheels);

  const y0=minD.getFullYear(),y1=maxD.getFullYear();
  const years=Array.from({length:y1-y0+1},(_,i)=>String(y0+i));
  let mW=null,yW=null;

  const atMin=()=>view.getFullYear()===minD.getFullYear()&&view.getMonth()===minD.getMonth();
  const atMax=()=>view.getFullYear()===maxD.getFullYear()&&view.getMonth()===maxD.getMonth();

  function draw(dir){
    title.firstChild.textContent=`${MONTHS[view.getMonth()]} ${view.getFullYear()}`;
    prev.disabled=atMin();next.disabled=atMax();
    const first=new Date(view.getFullYear(),view.getMonth(),1);
    const n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
    let html="";
    for(let i=0;i<first.getDay();i++)html+='<b class="pad">0</b>';
    for(let d=1;d<=n;d++){
      const k=keyOf(new Date(view.getFullYear(),view.getMonth(),d));
      const out=k<min||k>max;
      const cls=[out?"dim":"",k===todayKey()?"now":"",k===selKey?"sel":""].filter(Boolean).join(" ");
      html+=`<button type="button" class="${cls}" aria-label="${esc(fmt(k,{weekday:"long",month:"long",day:"numeric",year:"numeric"}))}"`
        +(k===selKey?' aria-current="date"':"")
        +(out?" disabled":` data-k="${k}"`)+`>${d}${!out&&logged(k)?"<em></em>":""}</button>`;
    }
    grid.className="cal-grid";
    void grid.offsetWidth;
    grid.innerHTML=html;
    if(dir)grid.classList.add(dir>0?"slide-l":"slide-r");
  }
  function hop(n){
    const v=new Date(view.getFullYear(),view.getMonth()+n,1);
    if(keyOf(v)<keyOf(minD))return;
    const cap=new Date(maxD.getFullYear(),maxD.getMonth(),1);
    if(keyOf(v)>keyOf(cap))return;
    view=v;draw(n);haptic(4);
    if(mW)mW.setTo(view.getMonth());
    if(yW)yW.setTo(view.getFullYear()-y0);
  }
  prev.onclick=()=>hop(-1);
  next.onclick=()=>hop(1);
  grid.addEventListener("click",e=>{
    const b=e.target.closest("button[data-k]");if(!b)return;
    haptic();
    grid.querySelectorAll(".sel").forEach(n=>{n.classList.remove("sel");n.removeAttribute("aria-current")});
    b.classList.add("sel");b.setAttribute("aria-current","date");
    onPick&&onPick(b.dataset.k);
  });

  title.onclick=()=>{
    const on=node.classList.toggle("picking");
    if(on&&!mW){
      const commit=()=>{
        const y=y0+yW.get(),m=mW.get();
        const d=new Date(y,m,1);
        const lo=new Date(minD.getFullYear(),minD.getMonth(),1);
        const hi=new Date(maxD.getFullYear(),maxD.getMonth(),1);
        view=d<lo?lo:d>hi?hi:d;
        if(view.getFullYear()!==y||view.getMonth()!==m){
          mW.setTo(view.getMonth());yW.setTo(view.getFullYear()-y0);
        }
        draw(0);
      };
      mW=wheel(MONTHS,view.getMonth(),commit);
      yW=wheel(years,view.getFullYear()-y0,commit);
      wheels.append(mW,yW);
      mW.init();yW.init();
    }
    haptic();
  };

  draw(0);
  node.goto=k=>{const d=fromKey(k);view=new Date(d.getFullYear(),d.getMonth(),1);draw(0)};
  return node;
}

/* Opens the calendar in a sheet. Resolves with a date key, or null. */
function pickDate({value,min,max,title="Select date"}){
  return new Promise(res=>{
    let done=false,cal=null;
    const root=sheet({
      title,left:"Cancel",right:"Today",
      onRight:()=>{if(!done){done=true;res(todayKey())}},
      build:body=>{
        cal=calendar({value,min,max,onPick:k=>{
          if(done)return;done=true;res(k);
          setTimeout(()=>root&&root.close(),210);
        }});
        body.appendChild(cal);
      }
    });
    const back=root.querySelector(".ov-back");
    const orig=root.close;
    root.close=()=>{orig();if(!done){done=true;res(null)}};
    back.onclick=()=>root.close();
    root.querySelector(".sheet-bar .l").onclick=()=>root.close();
  });
}

/* --- Animated segmented control --- */
function paintSeg(seg){
  const btns=[...seg.querySelectorAll("button")];
  const thumb=seg.querySelector(".thumb");
  const i=btns.findIndex(b=>b.getAttribute("aria-pressed")==="true");
  if(i<0){seg.classList.remove("on");return}
  const w=(seg.clientWidth-4)/btns.length;
  if(w<=0)return;                       /* hidden tab — lay it out when shown */
  const was=seg.classList.contains("on");
  if(!was)thumb.style.transition="none";  /* appear in place, slide only between options */
  thumb.style.width=w+"px";
  thumb.style.transform=`translateX(${i*w}px)`;
  if(!was){void thumb.offsetWidth;thumb.style.transition="";seg.classList.add("on")}
}

/* --- Swipe to delete --- */
const SW=96;
let openRow=null;
function closeRow(){if(openRow){openRow.querySelector(".sw-in").style.transform="";openRow=null}}
addEventListener("scroll",closeRow,{passive:true});
function swipeable(row){
  const inner=row.querySelector(".sw-in");
  row.addEventListener("pointerdown",e=>{
    if(e.target.closest(".sw-act"))return;
    const sx=e.clientX,sy=e.clientY,base=openRow===row?-SW:0;
    let axis=null;
    const move=ev=>{
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(axis===null){
        if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){
          axis="x";if(openRow&&openRow!==row)closeRow();
          /* Marks the row so the click ending this swipe is ignored. */
          row.dataset.swiping="1";
          inner.style.transition="none";
          try{row.setPointerCapture(ev.pointerId)}catch(err){}
        }else if(Math.abs(dy)>8){stop();return}
      }
      if(axis==="x"){
        ev.preventDefault();
        inner.style.transform=`translateX(${clampNum(base+dx,-SW-24,0)}px)`;
      }
    };
    const up=ev=>{
      if(axis==="x"){
        const v=base+(ev.clientX-sx);
        inner.style.transition="";
        if(v<-SW/2){inner.style.transform=`translateX(${-SW}px)`;openRow=row;haptic()}
        else{inner.style.transform="";if(openRow===row)openRow=null}
        /* Cleared after the click that follows this pointerup has been seen. */
        setTimeout(()=>{delete row.dataset.swiping},0);
      }
      stop();
    };
    const stop=()=>{
      row.removeEventListener("pointermove",move);
      removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
    };
    row.addEventListener("pointermove",move);
    addEventListener("pointerup",up);addEventListener("pointercancel",up);
  });
}

/* ==========================================================================
   Streaks
   ========================================================================== */
/* A streak day is one counting zero. Since a day with no entry now counts as
   zero, a streak would otherwise run backwards forever: it is bounded at the
   first day with any record, which is the earliest the app can speak for.
   One pass covers every habit, because it walks the whole history. */
function streaks(){
  const out={};
  for(const h of TRACKED)out[h.key]={cur:0,best:0,avg:0,runs:0};
  const ks=Object.keys(S.days);
  if(!ks.length)return out;
  const today=todayKey();
  let first=ks[0];
  for(const k of ks)if(k<first)first=k;
  if(first>today)first=today;

  const run={},lens={};
  for(const h of TRACKED){run[h.key]=0;lens[h.key]=[]}
  for(let d=fromKey(first);keyOf(d)<=today;d=addDays(d,1)){
    const k=keyOf(d),row=S.days[k];
    for(const h of TRACKED){
      if(countOf(h.key,k,row)===0)run[h.key]++;
      else{if(run[h.key])lens[h.key].push(run[h.key]);run[h.key]=0}
    }
  }
  for(const h of TRACKED){
    const o=out[h.key],l=lens[h.key];
    o.cur=run[h.key];                       /* the run still open at today */
    if(run[h.key])l.push(run[h.key]);
    o.best=l.length?Math.max(...l):0;
    o.avg=l.length?l.reduce((a,b)=>a+b,0)/l.length:0;
    o.runs=l.length;
  }
  return out;
}

function setDay(patch){S.days[cur]=Object.assign(day(cur),patch);schedule("day",cur);renderToday()}
/* Always reach at least five years back so earlier days can still be filled in,
   and stretch further if there is older history than that. */
function earliestKey(){
  const ks=Object.keys(S.days).sort();
  const floor=keyOf(addDays(new Date(),-365*5));
  return ks.length&&ks[0]<floor?ks[0]:floor;
}
function renderToday(){
  const d=day(cur),dt=fromKey(cur),isToday=cur===todayKey();
  const diff=Math.round((fromKey(todayKey())-dt)/864e5);
  $("dateLabel").textContent=isToday?"Today":diff===1?"Yesterday":
    diff<7?dt.toLocaleDateString(undefined,{weekday:"long"}):
    dt.toLocaleDateString(undefined,{month:"long",day:"numeric"});
  $("dateSub").textContent=dt.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  $("nextDay").disabled=isToday;
  $("prevDay").disabled=cur<=earliestKey();

  $("prayers").innerHTML=PRAYERS.map((en,i)=>
    `<button class="prayer" data-i="${i}" aria-pressed="${!!d.prayers[i]}">
      <i><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${PRAYER_ICON[i]}</svg></i>${en}
    </button>`).join("");
  const done=d.prayers.filter(Boolean).length;
  $("prayCount").textContent=`${done} of 5`;

  if(document.activeElement!==$("quran"))$("quran").value=+d.quran||0;
  $("qMinus").disabled=(+d.quran||0)<=0;

  for(const b of $("gym").querySelectorAll("button"))
    b.setAttribute("aria-pressed",String(b.dataset.v===d.gym&&!!d.gym));
  paintSeg($("gym"));

  const st=streaks();
  for(const h of TRACKED){
    const v=d[h.key];
    if(h.kind==="switch"){
      $(h.key+"Tgl").setAttribute("aria-checked",String(v>0));
    }else{
      const out=$(h.key+"Val");
      out.textContent=fmtVal(h,v);
      out.className="cnt"+(v===0?" zero":" some");
      out.setAttribute("aria-label",
        `${h.label}: ${h.fmt?fmtVal(h,v):v===1?"once":v+" times"}`);
      $(h.key+"Minus").disabled=v===0;
    }

    const s=st[h.key];
    $(h.key+"Cur").textContent=dayCount(s.cur);
    $(h.key+"Best").textContent=dayCount(s.best);
    $(h.key+"CurSub").textContent=s.cur&&s.cur===s.best&&s.cur>1?"Your best yet":"";
    $(h.key+"BestSub").textContent=s.runs>1?`over ${s.runs} streaks`:"";
  }
}

let qFilter="all",qQuery="";
const Q_FILTERS={all:"All",todo:"Not read",done:"Read"};
function renderQuran(){
  const set=new Set(S.meta.surahs),left=114-set.size;
  $("qCount").textContent=`${set.size} of 114`;
  $("qBar").style.width=(set.size/114*100).toFixed(1)+"%";
  $("qRounds").textContent=S.meta.rounds?`${S.meta.rounds} round${S.meta.rounds===1?"":"s"} done`:"";
  $("qLeft").textContent=left?`${left} to go`:"Every surah read";
  $("newRound").disabled=left>0;
  $("roundNote").textContent=left>0
    ?`Unlocks once all 114 are ticked. ${left} left.`
    :"All surahs read. Start a new round to reset the ticks.";
  $("qFilterLabel").textContent=Q_FILTERS[qFilter];
  $("qClear").classList.toggle("hidden",!qQuery);

  const q=qQuery.trim().toLowerCase();
  const rows=[];
  SURAH_EN.forEach((en,i)=>{
    const n=i+1,on=set.has(n);
    if(qFilter==="todo"&&on)return;
    if(qFilter==="done"&&!on)return;
    if(q&&!(en.toLowerCase().includes(q)||SURAH_AR[i].includes(q)||String(n)===q))return;
    rows.push(`<button class="surah" data-n="${n}" aria-pressed="${on}">
      <span class="n">${n}</span><span class="en">${esc(en)}</span>
      <span class="ar" lang="ar" dir="rtl">${esc(SURAH_AR[i])}</span>
      <span class="ck">${CHECK.replace("ck-i","")}</span></button>`);
  });
  $("surahs").innerHTML=rows.join("");
  $("surahs").classList.toggle("hidden",!rows.length);
  $("qNone").textContent=rows.length?"":(q?`No surah matches "${qQuery.trim()}".`:"Nothing here yet.");
}
$("surahs").addEventListener("click",e=>{
  const b=e.target.closest(".surah");if(!b)return;
  const n=+b.dataset.n,set=new Set(S.meta.surahs);
  set.has(n)?set.delete(n):set.add(n);
  S.meta.surahs=[...set].sort((a,b)=>a-b);
  haptic();schedule("meta");renderQuran();
});
$("qSearch").addEventListener("input",()=>{qQuery=$("qSearch").value;renderQuran()});
$("qClear").addEventListener("click",()=>{qQuery="";$("qSearch").value="";$("qSearch").focus();renderQuran()});
$("qFilterBtn").addEventListener("click",()=>{
  menu($("qFilterBtn"),Object.keys(Q_FILTERS).map(k=>({
    label:Q_FILTERS[k],selected:qFilter===k,onSelect:()=>{qFilter=k;renderQuran()}
  })));
});
$("newRound").addEventListener("click",async()=>{
  if(S.meta.surahs.length<114)return;
  const ok=await confirmBox("Start a new round?",
    "This clears all 114 ticks and adds one completed round.","Start new round",false);
  if(!ok)return;
  S.meta.rounds=(S.meta.rounds||0)+1;S.meta.surahs=[];
  schedule("meta");renderQuran();hud("Round "+S.meta.rounds);
});

let prDate=todayKey(),histFilter="";
const exNames=()=>{
  const seen=new Map();
  S.meta.prs.slice().sort((a,b)=>b.date.localeCompare(a.date))
    .forEach(p=>{const k=p.ex.toLowerCase();if(!seen.has(k))seen.set(k,p.ex)});
  return[...seen.values()];
};
function renderGym(){
  for(const b of $("unit").querySelectorAll("button"))
    b.setAttribute("aria-pressed",String(b.dataset.v===S.meta.unit));
  paintSeg($("unit"));
  $("prUnit").textContent=S.meta.unit;
  if(prDate>todayKey())prDate=todayKey();
  $("prDateLabel").textContent=prDate===todayKey()?"Today":
    prDate===keyOf(addDays(new Date(),-1))?"Yesterday":fmt(prDate,{weekday:"short",month:"short",day:"numeric",year:"numeric"});

  const prs=S.meta.prs.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const best={};
  for(const p of prs){
    const k=p.ex.toLowerCase(),b=best[k];
    if(!b||p.w>b.w||(p.w===b.w&&p.r>b.r))best[k]=p;
  }
  const bl=Object.values(best).sort((a,b)=>a.ex.localeCompare(b.ex));
  $("bestList").innerHTML=bl.length?bl.map(p=>
    `<button class="cell" data-edit="${esc(p.id)}"><span class="cl">${esc(p.ex)}<br><span class="sub">${esc(short(p.date))}</span></span>
     <span class="cv" style="color:var(--lab);font-weight:500">${p.w} ${esc(p.u)} × ${p.r}</span>${CHEV}</button>`).join("")
    :`<p class="empty">Save your first lift above.</p>`;

  const names=exNames();
  $("histLabel").textContent=histFilter?histFilter:"All";
  if(histFilter&&!names.some(n=>n.toLowerCase()===histFilter.toLowerCase()))histFilter="";
  const list=histFilter?prs.filter(p=>p.ex.toLowerCase()===histFilter.toLowerCase()):prs;
  $("prList").innerHTML=list.length?list.map(p=>
    `<div class="sw" data-id="${esc(p.id)}">
      <button class="sw-act" data-del="${esc(p.id)}">Delete</button>
      <div class="sw-in"><button class="cell" data-edit="${esc(p.id)}"><span class="cl">${esc(p.ex)}${best[p.ex.toLowerCase()]===p?'<span class="pr">PR</span>':""}<br><span class="sub">${esc(short(p.date))}</span></span>
      <span class="cv">${p.w} ${esc(p.u)} × ${p.r}</span>${CHEV}</button></div>
    </div>`).join("")
    :`<p class="empty">${prs.length?"Nothing logged for that exercise.":"No entries yet."}</p>`;
  $("prList").querySelectorAll(".sw").forEach(swipeable);
  openRow=null;
}

});

/* Edit one saved PR, with delete in the same place — so the swipe gesture is a
   shortcut rather than the only route to it. */
function openPrEditor(id){
  const p=S.meta.prs.find(x=>x.id===id);
  if(!p)return;
  const draft={u:p.u,date:p.date};
  const card=el("div","card");
  card.innerHTML=
    `<div class="cell"><span class="cl" style="flex:0 0 auto">Exercise</span>
       <input class="cin" data-f="ex" placeholder="Bench press" autocomplete="off" aria-label="Exercise">
       <button class="mini" data-a="exmenu" aria-label="Choose a previous exercise">${CHEV_CIRCLE}</button></div>
     <div class="cell"><span class="cl" style="flex:0 0 auto">Weight</span>
       <input class="cin" data-f="w" type="number" inputmode="decimal" min="0" step="any" aria-label="Weight">
       <span class="unit" data-a="unitlabel"></span></div>
     <div class="cell"><span class="cl" style="flex:0 0 auto">Reps</span>
       <input class="cin" data-f="r" type="number" inputmode="numeric" min="1" aria-label="Reps">
       <span class="unit"></span></div>
     <button class="cell" data-a="date"><span class="cl">Date</span><span class="cv" data-a="datelabel"></span>${CHEV}</button>
     <div class="cell"><span class="cl">Unit</span>
       <div class="seg" data-a="unit" style="width:118px" role="group" aria-label="Unit">
         <span class="thumb"></span><button data-v="lb">lb</button><button data-v="kg">kg</button></div></div>`;
  const f=s=>card.querySelector(`[data-f="${s}"]`);
  const a=s=>card.querySelector(`[data-a="${s}"]`);
  f("ex").value=p.ex;f("w").value=String(p.w);f("r").value=String(p.r);

  const paintUnit=()=>{
    for(const b of a("unit").querySelectorAll("button"))
      b.setAttribute("aria-pressed",String(b.dataset.v===draft.u));
    paintSeg(a("unit"));
    a("unitlabel").textContent=draft.u;
  };
  const paintDate=()=>{
    a("datelabel").textContent=draft.date===todayKey()?"Today":
      draft.date===keyOf(addDays(new Date(),-1))?"Yesterday":
      fmt(draft.date,{weekday:"short",month:"short",day:"numeric",year:"numeric"});
  };

  const root=sheet({
    title:"Edit lift",left:"Cancel",right:"Save",
    onRight:()=>{
      const ex=f("ex").value.trim(),w=+f("w").value,r=Math.round(+f("r").value);
      if(!ex)    {hud("Add an exercise",WARN);f("ex").focus();return false}
      if(!(w>0)) {hud("Add a weight",WARN);f("w").focus();return false}
      if(!(r>0)) {hud("Add some reps",WARN);f("r").focus();return false}
      const t=S.meta.prs.find(x=>x.id===id);
      if(!t){hud("That entry is gone",WARN);return true}
      t.ex=ex;t.w=Math.round(w*100)/100;t.r=r;t.u=draft.u;t.date=draft.date;
      schedule("meta");renderGym();haptic(10);hud("Lift updated");
      return true;
    },
    build:(body,r)=>{
      body.appendChild(card);
      const del=el("button","btn danger","Delete lift");
      del.onclick=async()=>{
        const ok=await confirmBox("Delete this entry?",
          `${p.ex} · ${p.w} ${p.u} × ${p.r} on ${short(p.date)}`);
        if(!ok)return;
        S.meta.prs=S.meta.prs.filter(x=>x.id!==id);
        schedule("meta");renderGym();r.close();hud("Deleted");
      };
      body.appendChild(del);
      paintUnit();paintDate();

      a("unit").addEventListener("click",e=>{
        const b=e.target.closest("button");if(!b)return;
        draft.u=b.dataset.v;haptic();paintUnit();
      });
      a("date").addEventListener("click",async()=>{
        const k=await pickDate({
          value:draft.date,min:keyOf(addDays(new Date(),-365*10)),max:todayKey(),title:"Date of the lift"
        });
        if(k){draft.date=k;paintDate()}
      });
      a("exmenu").addEventListener("click",()=>{
        const names=exNames(),val=f("ex").value.trim().toLowerCase();
        const items=names.slice(0,10).map(n=>({
          label:n,selected:n.toLowerCase()===val,onSelect:()=>{f("ex").value=n}
        }));
        if(!items.length)items.push({title:"No saved exercises yet"});
        menu(a("exmenu"),items);
      });
      card.querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{
        if(e.key==="Enter"){e.preventDefault();root.querySelector(".sheet-bar .r").click()}
      }));
    }
  });
}

function savePr(){

  if(!ex)       {hud("Add an exercise",WARN);$("prEx").focus();return}
  if(!(w>0))    {hud("Add a weight",WARN);$("prW").focus();return}
