/* ==========================================================================
   Stats
   ========================================================================== */
let range=7;
function renderStats(){
  const ks=Object.keys(S.days).sort();
  const since=ks.length?Math.round((fromKey(todayKey())-fromKey(ks[0]))/864e5)+1:1;
  const n=Math.max(1,range?Math.min(range,since):since);
  let pr=0,q=0,qDays=0,up=0,lo=0,rest=0;
  const tally={};TRACKED.forEach(h=>tally[h.key]={zero:0,sum:0});
  for(let i=0;i<n;i++){
    const d=day(keyOf(addDays(new Date(),-i)));
    pr+=d.prayers.filter(Boolean).length;
    const pages=+d.quran||0;q+=pages;if(pages>0)qDays++;
    if(d.gym==="upper")up++;else if(d.gym==="lower")lo++;else if(d.gym==="rest")rest++;
    for(const h of TRACKED){
      const v=d[h.key];
      if(v===0)tally[h.key].zero++;else if(v>0)tally[h.key].sum+=v;
    }
  }
  const r1=x=>Math.round(x*10)/10;
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";
  const gym=up+lo;
  const tile=([l,v,s])=>`<div class="tile"><span>${esc(l)}</span><b>${esc(v)}</b>${s?`<small>${esc(s)}</small>`:""}</div>`;
  $("rangeNote").textContent=range&&n<range?`Only ${dayCount(n)} of history so far.`
    :range?`Last ${dayCount(n)}.`:`All ${dayCount(n)} since you started.`;
  /* Same order as the Today tab: prayers, Quran, training, stayed clean. */
  $("prayerStats").innerHTML=[
    ["Prayers per day",String(r1(pr/n)),"out of 5"],
    ["Completion",pct(pr,n*5),`${pr} of ${n*5}`]
  ].map(tile).join("");
  $("quranStats").innerHTML=[
    ["Pages read",String(q),`${r1(q/n)} per day`],
    ["Days read",pct(qDays,n),`${qDays} of ${n}`]
  ].map(tile).join("");
  $("gymStats").innerHTML=[
    ["Training days",pct(gym,n),`${gym} of ${n}`],
    ["Upper / lower",`${up} / ${lo}`,gym?`${pct(up,gym)} / ${pct(lo,gym)}`:"no sessions yet"],
    ["Rest days",String(rest)],
    ["Not logged",String(Math.max(0,n-gym-rest))]
  ].map(tile).join("");
  const st=streaks();
  for(const h of TRACKED){
    const{zero,sum}=tally[h.key],s=st[h.key];
    $(h.key+"Stats").innerHTML=[
      [h.days,pct(zero,n),`${zero} of ${n}`],
      /* An average of a yes/no is meaningless; count the days instead. */
      h.kind==="switch"?[h.count,String(sum),`${pct(sum,n)} of days`]
                       :[h.perDay,h.fmt?h.fmt(sum/n):String(r1(sum/n))],
      ["Current streak",dayCount(s.cur)],
      ["Longest streak",dayCount(s.best),s.runs>1?`avg ${dayCount(r1(s.avg))}`:""]
    ].map(tile).join("");
  }

  /* Weekday-aligned 5-week calendar, Sunday first, ending this week. */
  const dow=DOW.map(d=>`<i>${esc(d)}</i>`).join("");
  $("dow1").innerHTML=dow;
  TRACKED.forEach(h=>{$(h.key+"Dow").innerHTML=dow});
  const now=new Date();
  const weekStart=addDays(now,-now.getDay());
  const start=addDays(weekStart,-28);
  const a=[],cells={};TRACKED.forEach(h=>cells[h.key]=[]);
  for(let i=0;i<35;i++){
    const dt=addDays(start,i),k=keyOf(dt),d=day(k);
    const fut=k>todayKey()?" fut":"",tod=k===todayKey()?" today":"";
    const t=fmt(k,{weekday:"short",month:"short",day:"numeric"});
    const p=d.prayers.filter(Boolean).length;
    a.push(`<i class="${p?"l"+Math.min(4,Math.ceil(p*4/5)):""}${fut}${tod}" title="${esc(t)}: ${p} of 5"></i>`);
    for(const h of TRACKED){
      const v=d[h.key];
      /* One step is the lighter shade, more than that the darker one — so a
         half hour reads like a single slip rather than a whole bad day. */
      const cls=v===0?"ok":v<=(h.step||1)?"bad":"bad2";
      const lbl=v===0?"none":h.fmt?h.fmt(v):v===1?"once":v+" times";
      cells[h.key].push(`<i class="${cls}${fut}${tod}" title="${esc(t)}: ${esc(lbl)}"></i>`);
    }
  }
  $("heatPray").innerHTML=a.join("");
  TRACKED.forEach(h=>{$(h.key+"Heat").innerHTML=cells[h.key].join("")});
}
$("range").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  range=+b.dataset.r;
  for(const x of $("range").querySelectorAll("button"))x.setAttribute("aria-pressed",String(x===b));
  paintSeg($("range"));haptic();renderStats();
});

/* ==========================================================================
   Keeping the data: browser storage is not forever on iOS, so ask the
   browser to hold on to it and make a one-tap copy easy to take off-device.
   ========================================================================== */
const BACKUP_DUE_DAYS=14;
async function askPersistence(){
  try{
    if(!navigator.storage||!navigator.storage.persist)return;
    if(await navigator.storage.persisted())return;
    await navigator.storage.persist();
  }catch(e){}
}
const hasData=()=>Object.keys(S.days).length>0||S.meta.prs.length>0||S.meta.surahs.length>0;
function daysSinceBackup(){
  if(!S.meta.backedUp)return null;
  return Math.round((fromKey(todayKey())-fromKey(S.meta.backedUp))/864e5);
}
function backupLabel(){
  const d=daysSinceBackup();
  if(d===null)return hasData()?"Never backed up":"Nothing to back up yet";
  return d===0?"Backed up today":d===1?"Backed up yesterday":`Backed up ${d} days ago`;
}
function backupDue(){
  if(!hasData())return false;
  const d=daysSinceBackup();
  return d===null||d>=BACKUP_DUE_DAYS;
}
function markBackedUp(){S.meta.backedUp=todayKey();schedule("meta");refreshBadge()}
function refreshBadge(){$("moreBtn").classList.toggle("due",backupDue())}

function backupFile(){
  const payload={app:"daily-habits",version:1,exported:new Date().toISOString(),data:S};
  const name=`daily-backup-${todayKey()}.json`;
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  return{name,blob};
}
/* Called straight from the menu tap so the share sheet still counts as a gesture. */
function exportBackup(){
  const{name,blob}=backupFile();
  const file=new File([blob],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"Daily backup"})
      .then(()=>{markBackedUp();hud("Backup saved")})
      .catch(e=>{if(!e||e.name!=="AbortError")saveViaLink(name,blob)});
    return;
  }
  saveViaLink(name,blob);
}
function saveViaLink(name,blob){
  const url=URL.createObjectURL(blob);
  const a=el("a");a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  markBackedUp();hud("Backup saved");
}
const tellUser=(title,message)=>alertBox({title,message,actions:[{label:"OK",style:"cancel"}]});
/* Takes a wrapped export or a bare state object; null if it is neither. */
function readBackup(parsed){
  const d=parsed&&parsed.data&&parsed.data.days?parsed.data:(parsed&&parsed.days?parsed:null);
  if(!d||typeof d.days!=="object"||Array.isArray(d.days))return null;
  return{days:d.days,meta:Object.assign(META0(),d.meta||{})};
}
function applyBackup(state){
  S={days:state.days,meta:state.meta};
  saveLocal();applyTheme();
  if(db&&uid){push("meta");for(const k of Object.keys(S.days))push("day",k)}
  cur=todayKey();showTab("today");refreshBadge();
}
function importBackup(){
  const inp=el("input");inp.type="file";inp.accept="application/json,.json";
  inp.addEventListener("change",async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    let parsed;
    try{parsed=JSON.parse(await f.text())}
    catch(e){return tellUser("Could not read that file","It is not valid JSON.")}
    const state=readBackup(parsed);
    if(!state)return tellUser("Not a Daily backup","That file does not hold Daily data.");
    const nd=Object.keys(state.days).length,np=state.meta.prs.length;
    const ok=await confirmBox("Restore this backup?",
      `${dayCount(nd)} and ${np} PR${np===1?"":"s"} will replace everything on this device.`,"Replace");
    if(!ok)return;
    applyBackup(state);hud(`Restored ${dayCount(nd)}`);
  });
  inp.click();
}

const fmtBytes=b=>b==null?"Unknown":b<1024?b+" bytes":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(1)+" MB";

/* What iOS will actually tell us, shown plainly rather than promised. */
async function openDataSheet(){
  let persisted=null;
  try{
    if(navigator.storage&&navigator.storage.persisted)persisted=await navigator.storage.persisted();
  }catch(e){}
  /* The log itself, not storage.estimate() — that counts the cached app
     shell too and would read as ~90KB for a 1KB log. */
  let bytes=null;
  try{const raw=localStorage.getItem(LS);bytes=raw?new Blob([raw]).size:0}catch(e){}
  const installed=isInstalled();
  const d=daysSinceBackup();
  sheet({
    title:"Data",left:"Close",
    build:(body,root)=>{
      const rows=[
        ...(syncConfigured()?[["Sync",signedIn()?session.user.email:"Off"]]:[]),
        ["Kept on this device",persisted===true?"Protected":persisted===false?"Best effort":"Unknown"],
        ["Opened from home screen",installed?"Yes":"No"],
        ["Days logged",String(Object.keys(S.days).length)],
        ["Backup size",fmtBytes(bytes)],
        ["Last backup",d===null?"Never":d===0?"Today":d===1?"Yesterday":dayCount(d)+" ago"]
      ];
      const card=el("div","card");
      card.innerHTML=rows.map(([k,v])=>
        `<div class="cell"><span class="cl">${esc(k)}</span><span class="cv">${esc(v)}</span></div>`).join("");
      body.appendChild(card);
      body.appendChild(el("p","foot",
        "Your log lives in this device's browser storage. iOS can still clear it if you delete the "+
        "home-screen icon, clear Safari's website data, or the phone runs very low on space. "+
        "A backup saved to Files or iCloud is the only copy that survives all three."));
      /* An icon that merely reopens a browser tab leaves the data on the
         7-day eviction clock, so say so rather than just reporting "No". */
      if(isIOS()&&!installed)body.appendChild(el("div","note",
        "<b>This opened in a browser tab, not as an installed app.</b> On iOS a tab's storage can be "+
        "cleared after about a week without opening it; an installed app is not on that clock. "+
        "To install it: open this page in <b>Safari</b>, tap Share, then Add to Home Screen, and "+
        "launch it from the icon. Storage does not carry across, so export a backup first and "+
        "restore it once installed."));
      if(syncConfigured()){
        const sy=el("button","btn"+(signedIn()?" ghost":""),
          signedIn()?"Stop syncing":"Turn on sync");
        sy.onclick=()=>{root.close();setTimeout(openSyncSheet,420)};
        body.appendChild(sy);
      }
      const ex=el("button","btn"+(syncConfigured()?" ghost":""),"Export backup");
      ex.onclick=()=>{exportBackup();root.close()};
      const im=el("button","btn ghost","Restore from a file");
      im.onclick=()=>{importBackup();root.close()};
      body.append(ex,im);
    }
  });
}

/* Sign in, or out, from the Data sheet. Two steps in one sheet: ask for the
   email, then for the code that arrives. */
function openSyncSheet(){
  if(signedIn()){
    confirmBox("Stop syncing?",
      `${session.user.email} will be signed out on this device. Your log stays here, and the synced copy is left untouched.`,
      "Sign out").then(ok=>{if(ok){signOut();hud("Signed out")}});
    return;
  }
  let step="email",email="";
  const root=sheet({
    title:"Sync",left:"Cancel",
    build:(body,r)=>{
      const card=el("div","card");
      const foot=el("p","foot","");
      const go=el("button","btn","Send me a code");
      const render=()=>{
        card.innerHTML=step==="email"
          ? `<div class="cell"><span class="cl" style="flex:0 0 auto">Email</span>
               <input class="cin" id="syncEmail" type="email" inputmode="email"
                 autocomplete="email" placeholder="you@example.com" aria-label="Email"></div>`
          : `<div class="cell"><span class="cl" style="flex:0 0 auto">Code</span>
               <input class="cin" id="syncCode" inputmode="numeric" autocomplete="one-time-code"
                 placeholder="123456" aria-label="Six digit code"></div>`;
        foot.textContent=step==="email"
          ? "We email you a six digit code. No password, and no link to open — a link would land in Safari rather than here."
          : `Enter the code sent to ${email}.`;
        go.textContent=step==="email"?"Send me a code":"Sign in";
        const i=card.querySelector("input");
        if(i){i.value="";setTimeout(()=>i.focus(),60)}
      };
      const submit=async()=>{
        const v=(card.querySelector("input")||{}).value||"";
        if(step==="email"){
          if(!/^\S+@\S+\.\S+$/.test(v.trim())){hud("Check the email",WARN);return}
          email=v.trim();go.disabled=true;go.textContent="Sending…";
          try{await sendCode(email);step="code";render()}
          catch(e){hud(e.message,WARN)}
          finally{go.disabled=false}
        }else{
          if(!/^\d{6}$/.test(v.trim())){hud("Six digits",WARN);return}
          go.disabled=true;go.textContent="Signing in…";
          try{
            await verifyCode(email,v.trim());
            r.close();hud("Syncing");await connect();renderAll();
          }catch(e){hud(e.message,WARN);go.disabled=false;go.textContent="Sign in"}
        }
      };
      go.onclick=submit;
      card.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()}});
      body.append(card,foot,go);
      render();
    }
  });
  return root;
}

/* Once per launch, and only when there is something to lose. */
async function maybeNudgeBackup(){
  if(!backupDue())return;
  try{if(sessionStorage.getItem("nudged"))return;sessionStorage.setItem("nudged","1")}catch(e){}
  const d=daysSinceBackup();
  const go=await alertBox({
    title:"Back up your data?",
    message:d===null
      ?"There is no saved copy yet. If iOS clears this app's storage, the log goes with it."
      :`It has been ${dayCount(d)} since your last backup.`,
    actions:[{label:"Not now",style:"cancel",value:false},{label:"Back up",value:true}]
  });
  if(go)exportBackup();
}

/* ==========================================================================
   Appearance + data menu
   ========================================================================== */
function applyTheme(){
  const t=S.meta.theme||"auto";
  if(t==="auto")delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=t;
}
$("moreBtn").addEventListener("click",()=>{
  const t=S.meta.theme||"auto";
  const opt=(k,label)=>({label,selected:t===k,onSelect:()=>{
    S.meta.theme=k;applyTheme();schedule("meta");allSegs().forEach(paintSeg);
  }});
  menu($("moreBtn"),[
    {title:"Appearance"},
    opt("auto","Automatic"),opt("light","Light"),opt("dark","Dark"),
    {separator:true},
    {title:backupLabel()},
    {label:"Export backup",icon:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V3.4M7.8 7.6 12 3.4l4.2 4.2M4.2 14.4v4.4a1.8 1.8 0 0 0 1.8 1.8h12a1.8 1.8 0 0 0 1.8-1.8v-4.4"/></svg>',
     onSelect:exportBackup},
    {label:"Data & storage",icon:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><ellipse cx="12" cy="5.6" rx="7.6" ry="3.1"/><path d="M4.4 5.6v12.8c0 1.7 3.4 3.1 7.6 3.1s7.6-1.4 7.6-3.1V5.6M4.4 12c0 1.7 3.4 3.1 7.6 3.1s7.6-1.4 7.6-3.1"/></svg>',
     onSelect:openDataSheet}
  ]);
});

/* ==========================================================================
   Tabs + chrome
   ========================================================================== */
const TITLES={today:"Today",quran:"Quran",gym:"Gym",stats:"Stats"};
function showTab(t){
  for(const k in TITLES)$("v-"+k).classList.toggle("hidden",k!==t);
  document.querySelectorAll(".tabbar button").forEach(b=>{
    if(b.dataset.tab===t)b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  $("title").textContent=$("navTitle").textContent=TITLES[t];
  try{history.replaceState(null,"","#"+t)}catch(e){location.hash=t}
  closeRow();renderAll();scrollTo(0,0);syncNav();
}
document.querySelectorAll(".tabbar button").forEach(b=>
  b.addEventListener("click",()=>{haptic();showTab(b.dataset.tab)}));

function renderAll(){
  renderToday();renderQuran();renderGym();renderStats();
  allSegs().forEach(paintSeg);   /* the shown tab is already laid out by now */
  refreshBadge();
}

/* The large title's own position drives both stages: the bar takes on its
   material once the title begins to pass under it, and only swaps in the inline
   title once the title has gone entirely. */
function syncNav(){
  const bar=$("navbar"),t=$("title").getBoundingClientRect();
  const edge=bar.getBoundingClientRect().bottom;
  const span=t.height||1,left=t.bottom-edge;
  bar.classList.toggle("material",t.top<edge-1);
  /* Hand over while the large title is still fading, so the two cross rather
     than leaving the bar briefly empty between them. */
  bar.classList.toggle("titled",left<=span*0.45);
  /* UIKit fades the large title out as the bar collapses rather than letting it
     slide under. Without this the part behind the bar still shows through the
     material and the title reads as sliced in half. */
  $("big").style.opacity=String(clampNum(left/span,0,1));
}
addEventListener("scroll",syncNav,{passive:true});
addEventListener("resize",syncNav);

/* A day can tick over while the app sits open. */
let seenDay=todayKey();
addEventListener("visibilitychange",()=>{
  if(document.hidden)return;
  if(todayKey()!==seenDay){
    if(cur===seenDay)cur=todayKey();
    seenDay=todayKey();
  }
  renderAll();
});

/* Offline shell, so the home-screen icon opens with no network. */
if("serviceWorker" in navigator){
  addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{scope:"./",updateViaCache:"none"}).catch(()=>{});
  });
}

applyTheme();
buildHabitSections();
const h=(location.hash||"").slice(1);
showTab(TITLES[h]?h:"today");
connect();
askPersistence();
/* Some browsers only grant persistence once the app has been used. */
addEventListener("pointerdown",function once(){
  removeEventListener("pointerdown",once);askPersistence();
},{passive:true});
setTimeout(maybeNudgeBackup,1400);
</script>
